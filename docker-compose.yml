services:
  influxdb-volume-init:
    image: busybox
    container_name: influxdb-volume-init
    restart: "no"
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
      - influxdb3-plugins:/var/lib/influxdb3/plugins
    command: chown -R 1500:1500 /var/lib/influxdb3/data /var/lib/influxdb3/plugins

  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    restart: unless-stopped
    stop_grace_period: 8s
    ports:
      - "8334:8181"
    depends_on:
      influxdb-volume-init:
        condition: service_completed_successfully
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --without-auth
      - --query-file-limit=5000
      - --wal-snapshot-size=100
      - --snapshotted-wal-files-to-keep=50
      # Note: --wal-replay-fail-on-error is intentionally NOT set.
      # Default behavior already skips corrupt WAL files on replay.
      # The flag is a boolean toggle that would ENABLE fail-on-error if present.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
      - influxdb3-plugins:/var/lib/influxdb3/plugins

  influxdb-init:
    image: influxdb:3-core
    container_name: influxdb-init
    restart: "no"
    depends_on:
      influxdb:
        condition: service_healthy
    entrypoint: >
      sh -c "influxdb3 create database mybucket
      --host http://influxdb:8181
      --retention-period 2w 2>/dev/null || true"

  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    restart: unless-stopped
    stop_grace_period: 5s
    ports:
      - "3046:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  influxdb3-data:
  influxdb3-plugins:
  grafana-data:
